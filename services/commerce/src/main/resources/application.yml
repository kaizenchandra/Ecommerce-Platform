server:
  port: 8080
  error:
    include-message: never
spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  task:
    scheduling:
      pool:
        size: 3
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/commerce}
    username: ${DATABASE_USER:commerce}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 10
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
commerce:
  customer-token: ${CUSTOMER_TOKEN:}
  customer-b-token: ${CUSTOMER_B_TOKEN:}
  local-mode: ${LOCAL_MODE:false}
  guest-secret: ${GUEST_SECRET}
  seller-token: ${SELLER_TOKEN:}
  seller-b-token: ${SELLER_B_TOKEN:}
  admin-token: ${ADMIN_TOKEN:}
  payment-mode: ${PAYMENT_MODE:mock}
  razorpay-key: ${RAZORPAY_KEY:}
  razorpay-secret: ${RAZORPAY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

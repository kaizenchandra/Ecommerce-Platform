name: Verify local marketplace
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/storefront/package-lock.json}
      - uses: actions/setup-go@v5
        with: {go-version: '1.24', cache-dependency-path: services/discovery/go.sum}
      - run: go test -race ./... && go vet ./...
        working-directory: services/discovery
      - run: npm ci && npm run typecheck
        working-directory: apps/storefront
      - run: node tests/contracts.mjs
      - run: docker compose -f compose.yaml -f compose.oidc.yaml up -d --build
      - run: node tests/wait-ready.mjs
      - run: node --test tests/system.test.mjs tests/reconciliation.test.mjs tests/cart.test.mjs tests/account.test.mjs tests/wishlist.test.mjs tests/fulfillment.test.mjs
      - run: node tests/seed.mjs
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: apps/storefront
        env:
          OIDC_TESTS: 'true'
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: browser-results, path: apps/storefront/test-results, if-no-files-found: ignore}
      - if: always()
        run: docker compose -f compose.yaml -f compose.oidc.yaml down
